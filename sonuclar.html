<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle sonuçlar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="circle-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5F4;--card:#FFFFFF;--ink:#0E2B28;--ink-2:#4A5E5A;--ink-3:#7F8E8A;--bar:#13866F;--track:#E7EBE9;--line:#DCE2DF;--teal-deep:#134F48;--danger:#9C3A2A}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bar);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}
header img{height:34px}
h1{font-weight:300;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;margin:0 0 8px}
.sub{color:var(--ink-2);margin:0 0 28px}
.btn{border:0;border-radius:999px;height:46px;padding:0 22px;font-weight:500;cursor:pointer;background:var(--ink);color:#fff;transition:background-color .14s}
.btn:hover{background:var(--teal-deep)}
.btn.light{background:var(--track);color:var(--ink)}
.btn.light:hover{background:var(--line)}
input[type=password]{width:100%;max-width:360px;background:#fff;border:0;border-radius:14px;height:50px;padding:0 18px;box-shadow:inset 0 0 0 1.5px var(--line)}
input[type=password]:focus{outline:none;box-shadow:inset 0 0 0 2px var(--bar)}
.err{color:var(--danger);min-height:1.4em;margin:10px 0 0}
.gate{max-width:520px;margin-top:8vh}
.gate form{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 28px}
.stat{background:var(--card);border-radius:18px;padding:18px 20px}
.stat b{display:block;font-weight:300;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--ink-2);font-size:14px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 28px}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--track);color:var(--ink-2);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.filters .gap{flex:1}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
.q{background:var(--card);border-radius:18px;padding:20px 22px 18px}
.q h2{font-weight:400;font-size:18px;line-height:1.3;margin:0 0 4px}
.q .meta{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:5px 0}
.row .lab{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.row .val{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.row .val b{color:var(--ink);font-weight:500}
.row .track{grid-column:1 / -1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.row .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:0}
.row:hover .lab{color:var(--teal-deep)}
.texts{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:360px;overflow:auto}
.texts li{background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px}
.empty{color:var(--ink-3);font-size:14px}
.full{grid-column:1 / -1}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="circle-logo.png" alt="circle"><div id="tools" hidden><button class="btn light" id="refresh">Yenile</button> <button class="btn" id="csv">CSV indir</button></div></header>
  <section class="gate" id="gate" hidden>
    <h1 id="gTitle">Sonuçlar</h1>
    <p class="sub" id="gText"></p>
    <form id="gForm"><input type="password" id="pw" autocomplete="current-password" placeholder="Şifre"><button class="btn" id="gBtn">Aç</button></form>
    <p class="err" id="gErr"></p>
  </section>
  <section id="dash" hidden>
    <h1>Anket sonuçları</h1>
    <p class="sub" id="upd"></p>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>
<script src="questions.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW = ''; try { PW = sessionStorage.getItem('circle_pw') || ''; } catch(e){}
let rows = [], onlyTarget = true, refSel = 'hepsi';

async function load(){
  const r = await fetch('/api/results?format=json', { headers:{'x-admin-key':PW}, cache:'no-store' });
  if (r.status === 401) return false;
  if (!r.ok) throw new Error(r.status);
  rows = (await r.json()).rows || [];
  return true;
}

async function gate(){
  const claimed = (await (await fetch('/api/claim',{cache:'no-store'})).json()).claimed;
  $('#gate').hidden = false;
  if (!claimed){
    $('#gTitle').textContent = 'Sonuç şifresini belirle';
    $('#gText').textContent = 'Bu şifre bir kez belirlenir ve sonuçları yalnızca bunu bilen görebilir. En az 8 karakter olsun, ekipçe bir yere not edin.';
    $('#gBtn').textContent = 'Şifreyi belirle';
    $('#pw').setAttribute('autocomplete','new-password');
  } else {
    $('#gText').textContent = 'Sonuçları görmek için ekip şifresini gir.';
  }
  $('#gForm').onsubmit = async e => {
    e.preventDefault(); $('#gErr').textContent = '';
    const pw = $('#pw').value;
    if (!claimed){
      if (pw.length < 8) { $('#gErr').textContent = 'Şifre en az 8 karakter olmalı.'; return; }
      const c = await fetch('/api/claim', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
      if (c.status === 409) { $('#gErr').textContent = 'Şifre az önce başka biri tarafından belirlenmiş. Sayfayı yenileyip o şifreyi gir.'; return; }
    }
    PW = pw;
    if (await load()) { try { sessionStorage.setItem('circle_pw', PW); } catch(e){} show(); }
    else $('#gErr').textContent = 'Şifre yanlış.';
  };
  $('#pw').focus();
}

function show(){
  $('#gate').hidden = true; $('#dash').hidden = false; $('#tools').hidden = false;
  $('#upd').textContent = 'Son güncelleme: ' + new Date().toLocaleString('tr-TR');
  render();
}

function render(){
  const refs = [...new Set(rows.map(r => r.ref || 'etiketsiz'))];
  let data = rows.filter(r => refSel === 'hepsi' || (r.ref || 'etiketsiz') === refSel);
  const all = data.length;
  const target = data.filter(r => r.answers?.rol && r.answers.rol !== 'hicbiri');
  if (onlyTarget) data = target;
  const yes = target.filter(r => r.answers?.gorusme === 'evet').length;
  const med = (() => { const s = rows.map(r => r.seconds).filter(Boolean).sort((a,b)=>a-b); return s.length ? Math.round(s[Math.floor(s.length/2)]) : 0; })();

  $('#stats').innerHTML = [
    [all, 'toplam yanıt'],
    [target.length, 'ailesinde yaşlı ya da kronik hasta olan'],
    [yes, 'görüşmeye açık'],
    [med ? med + ' sn' : '-', 'tipik doldurma süresi'],
  ].map(([v,l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');

  $('#filters').innerHTML =
    `<button class="chip" data-t="1" aria-pressed="${onlyTarget}">Sadece hedef kitle</button><button class="chip" data-t="0" aria-pressed="${!onlyTarget}">Herkes</button><span class="gap"></span>` +
    ['hepsi', ...refs].map(r => `<button class="chip" data-r="${esc(r)}" aria-pressed="${refSel===r}">${r==='hepsi'?'Tüm kanallar':esc(r)}</button>`).join('');
  $('#filters').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { onlyTarget = b.dataset.t === '1'; render(); });
  $('#filters').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { refSel = b.dataset.r; render(); });

  $('#grid').innerHTML = window.Q.map(q => {
    const ansd = data.map(r => r.answers?.[q.id]).filter(v => v !== undefined && v !== '' && !(Array.isArray(v) && !v.length));
    const n = ansd.length;
    if (q.type === 'text'){
      const t = ansd.map(v => String(v).trim()).filter(Boolean);
      return `<article class="q full"><h2>${esc(q.t.y)}</h2><p class="meta">${t.length} yazılı cevap</p>${t.length ? `<ul class="texts">${t.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="empty">Henüz yazılı cevap yok.</p>'}</article>`;
    }
    const counts = Object.fromEntries(q.o.map(([v]) => [v, 0]));
    ansd.forEach(v => (Array.isArray(v) ? v : [v]).forEach(x => { if (x in counts) counts[x]++; }));
    const bars = q.o.map(([v,l]) => {
      const c = counts[v], p = n ? Math.round(c / n * 100) : 0;
      return `<div class="row" title="${esc(l)}: ${c} kişi (%${p})"><span class="lab">${esc(l)}</span><span class="val"><b>%${p}</b> · ${c}</span><div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
    }).join('');
    return `<article class="q"><h2>${esc(q.t.y)}</h2><p class="meta">${n} kişi cevapladı${q.type==='multi' ? ', birden fazla seçilebiliyordu' : ''}</p>${n ? bars : '<p class="empty">Henüz cevap yok.</p>'}</article>`;
  }).join('');
}

$('#refresh').onclick = async () => { await load(); show(); };
$('#csv').onclick = async () => {
  const r = await fetch('/api/results', { headers:{'x-admin-key':PW}, cache:'no-store' });
  const b = await r.blob(); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'circle-anket-yanitlar.csv'; a.click(); URL.revokeObjectURL(a.href);
};

(async () => { if (PW && await load()) show(); else gate(); })();
</script>
</body>
</html>
